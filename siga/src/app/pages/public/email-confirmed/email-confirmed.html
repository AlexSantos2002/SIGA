<app-navbar></app-navbar>

<main class="email-confirmed-page">
  <section class="confirmation-hero" aria-hidden="true">
    <p class="eyebrow">{{ text.eyebrow }}</p>
    <h1>{{ text.heroTitle }}</h1>
    <p>{{ text.heroDescription }}</p>
  </section>

  <div class="modal-backdrop">
    <section class="confirmation-modal" role="dialog" aria-modal="true" aria-labelledby="confirmationTitle">
      <button type="button" class="close-button" [attr.aria-label]="text.closeLabel" (click)="close()">
        &times;
      </button>

      <ng-container [ngSwitch]="confirmationState">
        <ng-container *ngSwitchCase="'verifying'">
          <div class="status-icon verifying-icon" aria-hidden="true"></div>

          <h2 id="confirmationTitle">{{ text.verifyingTitle }}</h2>

          <p>{{ text.verifyingDescription }}</p>
        </ng-container>

        <ng-container *ngSwitchCase="'error'">
          <div class="status-icon error-icon" aria-hidden="true">!</div>

          <h2 id="confirmationTitle">{{ text.errorTitle }}</h2>

          <p>{{ text.errorDescription }}</p>

          <button type="button" class="primary-button" (click)="goToLogin()">{{ text.loginLabel }}</button>
        </ng-container>

        <ng-container *ngSwitchDefault>
          <div class="status-icon success-icon" aria-hidden="true">&#10003;</div>

          <h2 id="confirmationTitle">{{ text.successTitle }}</h2>

          <p>{{ text.successDescription }}</p>

          <button type="button" class="primary-button" (click)="close()">{{ text.continueLabel }}</button>
        </ng-container>
      </ng-container>
    </section>
  </div>
</main>

<app-footer></app-footer>
