<app-navbar></app-navbar>

<main class="email-confirmed-page">
  <section class="confirmation-hero" aria-hidden="true">
    <p class="eyebrow">Conta verificada</p>
    <h1>Bem-vindo ao SIGA</h1>
    <p>A confirmação do email foi concluída com sucesso.</p>
  </section>

  <div class="modal-backdrop">
    <section class="confirmation-modal" role="dialog" aria-modal="true" aria-labelledby="confirmationTitle">
      <button type="button" class="close-button" aria-label="Fechar mensagem" (click)="close()">&times;</button>

      <div class="success-icon" aria-hidden="true">&#10003;</div>

      <h2 id="confirmationTitle">Conta verificada com sucesso</h2>

      <p>
        O seu email foi confirmado. Já pode iniciar sessão e começar a utilizar a plataforma.
      </p>

      <button type="button" class="primary-button" (click)="close()">Continuar</button>
    </section>
  </div>
</main>

<app-footer></app-footer>
