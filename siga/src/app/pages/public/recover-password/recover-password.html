<section class="pagina-recuperacao">
  <div class="container-recuperacao">
    <div class="cabecalho-recuperacao">
      <p class="etiqueta-recuperacao">RECUPERAR ACESSO</p>

      <h1>Esqueceste-te da palavra-passe?</h1>

      <div class="linha-recuperacao"></div>

      <p class="descricao-recuperacao">
        Introduz o email associado à tua conta. Se a conta existir, vamos enviar uma ligação segura para
        definires uma nova palavra-passe.
      </p>
    </div>

    <form [formGroup]="form" (ngSubmit)="sendRecoveryEmail()" class="formulario-recuperacao" novalidate>
      <div class="grupo-campo">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          placeholder="email@exemplo.pt"
          formControlName="email"
          autocomplete="email"
          [class.campo-invalido]="form.get('email')?.invalid && form.get('email')?.touched"
          (input)="clearFeedback()"
        />

        <small *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
          Introduz um email válido.
        </small>
      </div>

      <p *ngIf="successMessage" class="mensagem-formulario sucesso" role="status">
        {{ successMessage }}
      </p>

      <p *ngIf="errorMessage" class="mensagem-formulario erro" role="alert">
        {{ errorMessage }}
      </p>

      <div class="acoes-recuperacao">
        <button type="submit" class="botao-principal" [disabled]="isSubmitting">
          {{ isSubmitting ? 'A enviar...' : 'Enviar email de recuperação' }}
        </button>

        <a routerLink="/login" class="link-secundario">
          Voltar ao login
        </a>
      </div>
    </form>
  </div>
</section>
