<section class="edit-animal-page">
  <div class="page-header">
    <div>
      <h1>Ficha do animal</h1>
      <p>Consulta e gere os dados associados ao animal.</p>
    </div>

    <a routerLink="/app/animals" class="back-button">Voltar à lista</a>
  </div>

  <div *ngIf="isLoading" class="loading">A carregar ficha do animal...</div>

  <div *ngIf="!isLoading && errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <ng-container *ngIf="!isLoading && animal">
    <section class="animal-image-section">
      <div class="animal-image-preview" [class.empty]="!animalImage">
        <img
          *ngIf="animalImage; else noAnimalImage"
          [src]="animalImage"
          [alt]="'Imagem de ' + animal.name"
        />

        <ng-template #noAnimalImage>
          <span>Sem imagem</span>
        </ng-template>
      </div>

      <div class="animal-image-actions">
        <button
          type="button"
          [class.primary-button]="!animal.imagePath"
          [class.secondary-button]="animal.imagePath"
          [disabled]="isImageSubmitting"
          (click)="openImagePicker()"
        >
          {{ animal.imagePath ? 'Alterar foto' : 'Adicionar foto' }}
        </button>

        <input
          #imageInput
          id="animal-image-upload"
          type="file"
          hidden
          accept="image/jpeg,image/png,image/webp"
          (change)="onImageSelected($event)"
        />

        <span *ngIf="selectedImageFile" class="selected-image-name">
          {{ selectedImageFile.name }}
        </span>

        <button
          *ngIf="selectedImageFile"
          type="button"
          class="primary-button"
          [disabled]="isImageSubmitting"
          (click)="saveSelectedImage()"
        >
          {{ isImageSubmitting ? 'A guardar...' : 'Guardar foto' }}
        </button>

        <button
          *ngIf="selectedImageFile"
          type="button"
          class="secondary-button"
          [disabled]="isImageSubmitting"
          (click)="clearSelectedImage()"
        >
          Cancelar
        </button>

        <button
          *ngIf="animal.imagePath"
          type="button"
          class="remove-record-button"
          [disabled]="isImageSubmitting"
          (click)="removeImage()"
        >
          {{ isImageSubmitting ? 'A remover...' : 'Remover foto' }}
        </button>
      </div>
    </section>

    <app-animal-summary-cards
      [animal]="animal"
      [acceptedAdoption]="acceptedAdoption"
      (editSection)="openModal($event)"
    ></app-animal-summary-cards>

    <app-animal-vaccines-section
      [vaccines]="vaccines"
      (addVaccine)="openModal('vaccine')"
      (removeVaccine)="deleteVaccine($event)"
    ></app-animal-vaccines-section>

    <app-animal-deworming-section
      [records]="dewormingRecords"
      (addDeworming)="openModal('deworming')"
      (removeDeworming)="deleteDeworming($event)"
    ></app-animal-deworming-section>

    <app-animal-vet-appointments-section
      [appointments]="vetAppointments"
      (addAppointment)="openModal('appointment')"
      (removeAppointment)="deleteVetAppointment($event)"
    ></app-animal-vet-appointments-section>
  </ng-container>

  <app-animal-edit-modal
    *ngIf="activeModal"
    [activeModal]="activeModal"
    [form]="form"
    [vaccineForm]="vaccineForm"
    [dewormingForm]="dewormingForm"
    [appointmentForm]="appointmentForm"
    [isSubmitting]="isSubmitting"
    (close)="closeModal()"
    (submitAnimal)="submit()"
    (submitVaccine)="addVaccine()"
    (submitDeworming)="addDeworming()"
    (submitAppointment)="addVetAppointment()"
  ></app-animal-edit-modal>
</section>
