<section class="add-animal-page">
  <div class="page-header">
    <div>
      <h1>Adicionar animal</h1>
      <p>Regista um novo animal associado à tua organização.</p>
    </div>

    <a routerLink="/app/animals" class="back-button">
      Voltar à lista
    </a>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="animal-form">
    <div class="form-section">
      <h2>Informação principal</h2>

      <div class="form-grid">
        <div class="form-field">
          <label for="name">Nome do animal</label>
          <input
            id="name"
            type="text"
            formControlName="name"
            placeholder="Ex: Rex"
          />

          <small *ngIf="form.get('name')?.touched && form.get('name')?.invalid">
            O nome é obrigatório.
          </small>
        </div>

        <div class="form-field">
          <label for="speciesName">Espécie</label>
          <input
            id="speciesName"
            type="text"
            formControlName="speciesName"
            placeholder="Ex: Cão, Gato, Ave"
          />

          <small *ngIf="form.get('speciesName')?.touched && form.get('speciesName')?.invalid">
            A espécie é obrigatória.
          </small>
        </div>

        <div class="form-field">
          <label for="breedName">Raça</label>
          <input
            id="breedName"
            type="text"
            formControlName="breedName"
            placeholder="Ex: Labrador, Pastor Alemão, Mista"
          />

          <small *ngIf="form.get('breedName')?.touched && form.get('breedName')?.invalid">
            A raça é obrigatória.
          </small>
        </div>

        <div class="form-field">
          <label for="gender">Género</label>
          <select id="gender" formControlName="gender">
            <option value="" disabled>Seleciona o género</option>
            <option *ngFor="let gender of genders" [value]="gender.value">
              {{ gender.label }}
            </option>
          </select>

          <small *ngIf="form.get('gender')?.touched && form.get('gender')?.invalid">
            O género é obrigatório.
          </small>
        </div>

        <div class="form-field full-date-field">
          <label for="birthDate">Data de nascimento</label>
          <app-date-picker inputId="birthDate" formControlName="birthDate"></app-date-picker>

          <small
            *ngIf="form.get('birthDate')?.touched && form.get('birthDate')?.invalid"
          >
            A data de nascimento é obrigatória.
          </small>
        </div>

        <div class="form-field">
          <label for="status">Estado do animal</label>
          <select id="status" formControlName="status">
            <option *ngFor="let status of statuses" [value]="status.value">
              {{ status.label }}
            </option>
          </select>

          <small *ngIf="form.get('status')?.touched && form.get('status')?.invalid">
            O estado é obrigatório.
          </small>
        </div>
      </div>
    </div>

    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <div class="form-actions">
      <a routerLink="/app/animals" class="cancel-button">
        Cancelar
      </a>

      <label for="image-upload" class="upload-button">
        {{ selectedFile?.name || 'Adicionar imagem' }}
      </label>

        <input
          id="image-upload"
          class="image-button"
          type="file"
          hidden
          accept="image/jpeg,image/png,image/webp"
          (change)="onFileSelected($event)"
        >

      <button type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'A guardar...' : 'Guardar animal' }}
      </button>


    </div>
  </form>
</section>
