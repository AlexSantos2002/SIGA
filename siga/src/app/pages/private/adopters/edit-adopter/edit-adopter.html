<section class="adopter-form-page">
  <div class="page-header">
    <div>
      <h1>Editar adotante</h1>
      <p>Atualiza a ficha e a sinalização do adotante.</p>
    </div>

    <a routerLink="/app/adopters" class="back-button">Voltar à lista</a>
  </div>

  <div *ngIf="isLoading" class="loading">A carregar adotante...</div>

  <div *ngIf="!isLoading && errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <app-adopter-form
    *ngIf="!isLoading && adopter"
    [form]="form"
    [isSubmitting]="isSubmitting"
    submitLabel="Guardar alteracoes"
    submittingLabel="A guardar..."
    (formSubmit)="submit()"
  ></app-adopter-form>
</section>
