<form [formGroup]="form" (ngSubmit)="submit()" class="adopter-form">
  <div class="form-section">
    <h2>Informação pessoal</h2>

    <div class="form-grid">
      <div class="form-field">
        <label for="name">Nome</label>
        <input id="name" type="text" formControlName="name" placeholder="Ex: Ana" />
        <small *ngIf="form.get('name')?.touched && form.get('name')?.invalid">
          O nome é obrigatório.
        </small>
      </div>

      <div class="form-field">
        <label for="lastName">Apelido</label>
        <input id="lastName" type="text" formControlName="lastName" placeholder="Ex: Silva" />
        <small *ngIf="form.get('lastName')?.touched && form.get('lastName')?.invalid">
          O apelido é obrigatório.
        </small>
      </div>

      <div class="form-field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="Ex: ana@email.com" />
        <small *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
          Introduz um email válido.
        </small>
      </div>

      <div class="form-field">
        <label for="phone">Telefone</label>
        <input id="phone" type="tel" formControlName="phone" placeholder="Ex: 912345678" />
        <small *ngIf="form.get('phone')?.touched && form.get('phone')?.invalid">
          O telefone é obrigatório.
        </small>
      </div>

      <div class="form-field">
        <label for="documentType">Tipo de documento</label>
        <select id="documentType" formControlName="documentType">
          <option value="">Não definido</option>
          <option *ngFor="let documentType of documentTypes" [value]="documentType.value">
            {{ documentType.label }}
          </option>
        </select>
      </div>

      <div class="form-field">
        <label for="documentNumber">Número do documento</label>
        <input id="documentNumber" type="text" formControlName="documentNumber" />
      </div>

      <div class="form-field">
        <label for="birthDate">Data de nascimento</label>
        <app-date-picker inputId="birthDate" formControlName="birthDate"></app-date-picker>
      </div>
    </div>
  </div>

  <div class="form-section">
    <h2>Morada e habitação</h2>

    <div class="form-grid">
      <div class="form-field full-width">
        <label for="address">Morada</label>
        <input id="address" type="text" formControlName="address" />
      </div>

      <div class="form-field">
        <label for="city">Cidade</label>
        <input id="city" type="text" formControlName="city" />
      </div>

      <div class="form-field">
        <label for="postalCode">Código postal</label>
        <input id="postalCode" type="text" formControlName="postalCode" />
      </div>

      <div class="form-field">
        <label for="housingType">Tipo de habitação</label>
        <select id="housingType" formControlName="housingType">
          <option value="">Não definido</option>
          <option *ngFor="let housingType of housingTypes" [value]="housingType.value">
            {{ housingType.label }}
          </option>
        </select>
      </div>

      <label class="checkbox-field">
        <input type="checkbox" formControlName="hasOutdoorSpace" />
        <span>Tem espaço exterior</span>
      </label>

      <div class="form-field full-width">
        <label for="householdMembers">Agregado familiar</label>
        <textarea id="householdMembers" formControlName="householdMembers"></textarea>
      </div>

      <div class="form-field">
        <label for="employmentStatus">Situação profissional</label>
        <select id="employmentStatus" formControlName="employmentStatus">
          <option value="">Não definido</option>
          <option *ngFor="let status of employmentStatuses" [value]="status.value">
            {{ status.label }}
          </option>
        </select>
      </div>
    </div>
  </div>

  <div class="form-section">
    <h2>Experiência e adoção</h2>

    <div class="form-grid">
      <label class="checkbox-field">
        <input type="checkbox" formControlName="hasOtherAnimals" />
        <span>Tem outros animais</span>
      </label>

      <div class="form-field">
        <label for="preferredSpecies">Preferencia</label>
        <select id="preferredSpecies" formControlName="preferredSpecies">
          <option value="">Não definido</option>
          <option *ngFor="let species of preferredSpecies" [value]="species.value">
            {{ species.label }}
          </option>
        </select>
      </div>

      <div class="form-field full-width">
        <label for="otherAnimalsDescription">Outros animais</label>
        <textarea id="otherAnimalsDescription" formControlName="otherAnimalsDescription"></textarea>
      </div>

      <div class="form-field full-width">
        <label for="experienceWithAnimals">Experiência com animais</label>
        <textarea id="experienceWithAnimals" formControlName="experienceWithAnimals"></textarea>
      </div>

      <div class="form-field full-width">
        <label for="adoptionMotivation">Motivo da adoção</label>
        <textarea id="adoptionMotivation" formControlName="adoptionMotivation"></textarea>
      </div>
    </div>
  </div>

  <div class="form-section">
    <h2>Gestão interna</h2>

    <div class="form-grid">
      <div class="form-field full-width">
        <label for="notes">Notas internas</label>
        <textarea id="notes" formControlName="notes"></textarea>
      </div>

      <label class="checkbox-field">
        <input type="checkbox" formControlName="isFlagged" />
        <span>Sinalizar adotante</span>
      </label>

      <div class="form-field full-width" *ngIf="form.value.isFlagged">
        <label for="flagReason">Motivo da sinalização</label>
        <textarea id="flagReason" formControlName="flagReason"></textarea>
        <small *ngIf="form.get('flagReason')?.touched && form.get('flagReason')?.invalid">
          O motivo é obrigatório quando o adotante está sinalizado.
        </small>
      </div>
    </div>
  </div>

  <div class="form-actions">
    <a routerLink="/app/adopters" class="cancel-button">Cancelar</a>
    <button type="submit" [disabled]="isSubmitting">
      {{ isSubmitting ? submittingLabel : submitLabel }}
    </button>
  </div>
</form>
