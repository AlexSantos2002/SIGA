<section class="adopter-form-page">
  <div class="page-header">
    <div>
      <h1>Registar adotante</h1>
      <p>Regista a informação completa do adotante na tua organização.</p>
    </div>

    <a routerLink="/app/adopters" class="back-button">Voltar à lista</a>
  </div>

  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <app-adopter-form
    [form]="form"
    [isSubmitting]="isSubmitting"
    submitLabel="Guardar adotante"
    submittingLabel="A guardar..."
    (formSubmit)="submit()"
  ></app-adopter-form>
</section>
