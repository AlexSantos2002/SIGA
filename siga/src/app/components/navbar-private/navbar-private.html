<header class="navbar-privada">
  <div class="loading-bar" [class.active]="loading.isLoading()"></div>

  <div class="area-esquerda">
    <div class="marca-privada">
      <img src="/favicon.ico" alt="Logótipo SIGA" class="logo-imagem" />

      <span class="nome-marca">SIGA</span>
    </div>

    <div class="info-organizacao">
      <span class="etiqueta"
            i18n="Organization label@@navbar.private.organization.label">
        Organização
      </span>

      <strong>
        <ng-container *ngIf="organizationId; else noOrganization">
          <span i18n="Associated organization text@@navbar.private.organization.associated">
            Organização associada
          </span>
        </ng-container>

        <ng-template #noOrganization>
          <span i18n="Organization text@@navbar.private.organization.default">
            Organização
          </span>
        </ng-template>
      </strong>
    </div>
  </div>

  <div class="area-utilizador">
    <app-language-switcher></app-language-switcher>

    <button type="button" class="botao-utilizador" (click)="toggleMenu()">
      <div class="avatar">
        {{ userName.charAt(0).toUpperCase() }}
      </div>

      <div class="dados-utilizador">
        <span>{{ userName }}</span>
        <small>{{ userEmail }}</small>
      </div>

      <span class="seta">
        {{ isMenuOpen ? '▲' : '▼' }}
      </span>
    </button>

    <div *ngIf="isMenuOpen" class="menu-utilizador">
      <a routerLink="/app/profile"
         i18n="Profile menu item@@navbar.private.menu.profile">
        Perfil
      </a>

      <a routerLink="/app/settings"
         i18n="Settings menu item@@navbar.private.menu.settings">
        Definições
      </a>

      <button type="button"
              (click)="logout()"
              i18n="Logout button@@navbar.private.menu.logout">
        Terminar sessão
      </button>
    </div>
  </div>
</header>
